<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sherpa (Playground)</title>
		<link rel="icon" href="/assets/sherpa.png" />
		<!-- Exactly the three families this page's CSS asks for, in one request.
		     It used to be three stylesheets and two duplicate preconnect pairs,
		     fetching IBM Plex Mono and Hind (twice) that nothing here uses. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Inter+Tight:ital,wght@0,100..900;1,100..900&amp;family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&amp;display=swap"
			rel="stylesheet"
		/>
		<style>
			body,
			html,
			#app {
				font-family:
					"Inter",
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				width: 100vw;
				height: 100vh;
				margin: 0;
				padding: 0;
				background-color: #050505;
				overflow: hidden;
			}

			@keyframes fade {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
		</style>
		<script src="/dreamland/dev.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="/engine/sherpa.all.js"></script>
		<script src="config.js"></script>
		<script src="store.js"></script>
	</head>

	<body>
		<div id="app"></div>
		<script src="playground.js"></script>
	</body>
</html>
